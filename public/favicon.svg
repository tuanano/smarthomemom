<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#FF8C69"/>

  <!-- Green leaf at roof peak -->
  <path d="M50,4 C44,9 43,15 50,21 C57,15 56,9 50,4 Z" fill="#5DBE5D"/>

  <!-- House roof -->
  <line x1="50" y1="16" x2="10" y2="46" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="16" x2="90" y2="46" stroke="white" stroke-width="4.5" stroke-linecap="round"/>

  <!-- House walls and floor -->
  <polyline points="20,46 20,82 80,82 80,46" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Heart inside house -->
  <path d="M50,49 C50,41 38,36 33,43 C28,50 34,59 50,74 C66,59 72,50 67,43 C62,36 50,41 50,49 Z"
        fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
